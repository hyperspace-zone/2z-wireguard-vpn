modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      method: GET
      follow_redirects: true
      preferred_ip_protocol: ip4
      valid_http_versions:
        - HTTP/1.1
        - HTTP/2.0
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      # The current observability host has IPv4 egress, no routed IPv6. Managed
      # database hostnames have AAAA records; use the same family as clients.
      preferred_ip_protocol: ip4
