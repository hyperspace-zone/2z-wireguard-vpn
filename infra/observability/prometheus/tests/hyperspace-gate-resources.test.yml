rule_files:
  - ../rules/hyperspace-alerts.yml

evaluation_interval: 15s

tests:
  - name: observability node exporter outage is critical
    interval: 15s
    input_series:
      - series: 'up{job="hyperspace-observability-node",cluster="mainnet",role="observability",instance="127.0.0.1:9100"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 2m15s
        alertname: HyperspaceObservabilityNodeExporterDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: hyperspace-observability-node
              cluster: mainnet
              role: observability
              instance: 127.0.0.1:9100
            exp_annotations:
              summary: Hyperspace observability host metrics scrape is down
              description: Prometheus cannot scrape its local observability node exporter for 2 minutes, so host disk capacity is no longer monitored.

  - name: observability root filesystem low space is critical
    interval: 15s
    input_series:
      - series: 'node_filesystem_avail_bytes{job="hyperspace-observability-node",cluster="mainnet",role="observability",instance="127.0.0.1:9100",mountpoint="/",fstype="ext4"}'
        values: '3000000000x22'
      - series: 'node_filesystem_size_bytes{job="hyperspace-observability-node",cluster="mainnet",role="observability",instance="127.0.0.1:9100",mountpoint="/",fstype="ext4"}'
        values: '42949672960x22'
    alert_rule_test:
      - eval_time: 5m15s
        alertname: HyperspaceObservabilityRootFilesystemCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              job: hyperspace-observability-node
              cluster: mainnet
              role: observability
              instance: 127.0.0.1:9100
              mountpoint: /
              fstype: ext4
            exp_annotations:
              summary: Hyperspace observability root filesystem is critically full
              description: Observability host 127.0.0.1:9100 in mainnet has less than 15% or 4GiB available on /; Prometheus may stop ingesting metrics and emitting alerts.

  - name: low absolute memory fires critical even above ten percent
    interval: 15s
    input_series:
      - series: 'node_memory_MemAvailable_bytes{job="hyperspace-gate-node",gate="gate-test",instance="192.0.2.10:9100"}'
        values: '120000000x4'
      - series: 'node_memory_MemTotal_bytes{job="hyperspace-gate-node",gate="gate-test",instance="192.0.2.10:9100"}'
        values: '888500224x4'
    alert_rule_test:
      - eval_time: 45s
        alertname: HyperspaceGateMemoryCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              job: hyperspace-gate-node
              gate: gate-test
              instance: 192.0.2.10:9100
            exp_annotations:
              summary: Hyperspace gate memory is critically low
              description: Gate gate-test has less than 10% or 128MiB available RAM.

  - name: recovered critical runtime pressure is still reported
    interval: 15s
    input_series:
      - series: 'hyperspace_gate_runtime_filesystem_last_before_used_percent{job="hyperspace-gate-node",gate="gate-test",instance="192.0.2.10:9100"}'
        values: '90x2'
      - series: 'hyperspace_gate_runtime_filesystem_last_after_used_percent{job="hyperspace-gate-node",gate="gate-test",instance="192.0.2.10:9100"}'
        values: '2x2'
    alert_rule_test:
      - eval_time: 15s
        alertname: HyperspaceGateRuntimeFilesystemCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              job: hyperspace-gate-node
              gate: gate-test
              instance: 192.0.2.10:9100
            exp_annotations:
              summary: Hyperspace gate runtime filesystem is critically full
              description: Gate gate-test reached at least 85% usage on /run, which can prevent login and service operation.

  - name: conntrack reaches critical threshold
    interval: 15s
    input_series:
      - series: 'hyperspace_gate_conntrack_entries{job="hyperspace-gate-node",gate="gate-test",instance="192.0.2.10:9100"}'
        values: '59000x6'
      - series: 'hyperspace_gate_conntrack_limit{job="hyperspace-gate-node",gate="gate-test",instance="192.0.2.10:9100"}'
        values: '65536x6'
    alert_rule_test:
      - eval_time: 1m15s
        alertname: HyperspaceGateConntrackCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              job: hyperspace-gate-node
              gate: gate-test
              instance: 192.0.2.10:9100
            exp_annotations:
              summary: Hyperspace gate conntrack table is critically full
              description: Gate gate-test has used at least 90% of its conntrack table and may drop new connections.

  - name: enabled gate missing from discovery
    interval: 15s
    input_series:
      - series: 'hyperspace_control_plane_gate_agent_connected{job="hyperspace-control-plane-worker",gate="gate-test",enabled="true"}'
        values: '1x22'
    alert_rule_test:
      - eval_time: 5m15s
        alertname: HyperspaceEnabledGateMissingFromDiscovery
        exp_alerts:
          - exp_labels:
              severity: warning
              job: hyperspace-control-plane-worker
              gate: gate-test
              enabled: "true"
            exp_annotations:
              summary: Enabled Hyperspace gate is missing from Prometheus discovery
              description: Gate gate-test is enabled in the control-plane catalog but has no node-exporter target.
