rule_files:
  - ../rules/hyperspace-alerts.yml

evaluation_interval: 15s

tests:
  - name: stale independent meta monitor is critical
    interval: 1m
    input_series:
      - series: 'hyperspace_meta_watch_last_run_timestamp_seconds{job="hyperspace-host-node",role="observability",cluster="staging",service_host="observability.staging.hyperspace.zone",service_ipv4="84.32.110.4",instance="127.0.0.1:9100"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: HyperspaceMetaWatchStale
        exp_alerts:
          - exp_labels:
              severity: critical
              job: hyperspace-host-node
              role: observability
              cluster: staging
              service_host: observability.staging.hyperspace.zone
              service_ipv4: 84.32.110.4
              instance: 127.0.0.1:9100
            exp_annotations:
              summary: Hyperspace independent meta-monitor is stale
              description: The independent alert-delivery meta-monitor on observability.staging.hyperspace.zone has not completed a run for more than 5 minutes.

  - name: independent meta monitor failure is critical
    interval: 1m
    input_series:
      - series: 'hyperspace_meta_watch_healthy{job="hyperspace-host-node",role="observability",cluster="staging",service_host="observability.staging.hyperspace.zone",service_ipv4="84.32.110.4",instance="127.0.0.1:9100"}'
        values: '0x8'
    alert_rule_test:
      - eval_time: 6m
        alertname: HyperspaceMetaWatchDetectedFailure
        exp_alerts:
          - exp_labels:
              severity: critical
              job: hyperspace-host-node
              role: observability
              cluster: staging
              service_host: observability.staging.hyperspace.zone
              service_ipv4: 84.32.110.4
              instance: 127.0.0.1:9100
            exp_annotations:
              summary: Hyperspace independent meta-monitor detected a failure
              description: The independent alert-delivery meta-monitor on observability.staging.hyperspace.zone detected an Alertmanager, Telegram delivery, or peer observability failure. Its direct Telegram and Resend notifications do not depend on this Alertmanager alert.

  - name: drained DoubleZero recovery failure is critical and reports completed automation
    interval: 15s
    input_series:
      - series: 'hyperspace_control_plane_gate_doublezero_ready{job="hyperspace-control-plane-worker",cluster="mainnet",enabled="true",gate="gate-na-mia-71",probe_host="gate-na-mia-71.hyperspace.zone",public_ipv4="162.252.175.95",current_device="laconic-mia-sw01",current_device_status="drained",recovery_state="failed",recovery_reason="automatic_reconnect_failed_cooldown",recovery_last_outcome="failed",recovery_last_stage="verification_failed",recovery_attempted_at="2026-08-19T10:00:00Z",recovery_next_eligible_at="2026-08-19T16:00:00Z"}'
        values: '0x45'
      - series: 'hyperspace_control_plane_gate_agent_connected{enabled="true",gate="gate-na-mia-71"}'
        values: '1x45'
    alert_rule_test:
      - eval_time: 10m15s
        alertname: HyperspaceEnabledGateDoubleZeroNotReady
        exp_alerts:
          - exp_labels:
              severity: critical
              job: hyperspace-control-plane-worker
              cluster: mainnet
              enabled: "true"
              gate: gate-na-mia-71
              probe_host: gate-na-mia-71.hyperspace.zone
              public_ipv4: 162.252.175.95
              current_device: laconic-mia-sw01
              current_device_status: drained
              recovery_state: failed
              recovery_reason: automatic_reconnect_failed_cooldown
              recovery_last_outcome: failed
              recovery_last_stage: verification_failed
              recovery_attempted_at: "2026-08-19T10:00:00Z"
              recovery_next_eligible_at: "2026-08-19T16:00:00Z"
            exp_annotations:
              summary: Enabled Hyperspace gate DoubleZero connectivity is unavailable
              description: Gate gate-na-mia-71 is enabled but DoubleZero is not ready. Current device=laconic-mia-sw01, device status=drained, recovery state=failed, reason=automatic_reconnect_failed_cooldown. The gate-agent already attempted 'doublezero disconnect ibrl' followed by 'doublezero connect ibrl' at 2026-08-19T10:00:00Z, but BGP and routes were not restored. Do not loop the command before 2026-08-19T16:00:00Z; inspect gate-agent/doublezerod logs and escalate to DoubleZero if the device remains drained.

  - name: stalled gate agent deployment is critical and carries gate access
    interval: 15s
    input_series:
      - series: 'hyperspace_control_plane_gate_agent_deployment_active_age_seconds{job="hyperspace-control-plane-worker",cluster="mainnet",gate="gate-eu-lon-01",phase="verifying",release_version="0.2.2",release_revision="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",artifact_sha256="bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb",probe_host="gate-eu-lon-01.hyperspace.zone",public_ipv4="192.0.2.10"}'
        values: '700x10'
    alert_rule_test:
      - eval_time: 2m15s
        alertname: HyperspaceGateAgentDeploymentStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              job: hyperspace-control-plane-worker
              cluster: mainnet
              gate: gate-eu-lon-01
              phase: verifying
              release_version: 0.2.2
              release_revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              artifact_sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
              probe_host: gate-eu-lon-01.hyperspace.zone
              public_ipv4: 192.0.2.10
            exp_annotations:
              summary: Hyperspace gate-agent deployment is stalled
              description: Gate gate-eu-lon-01 has remained in verifying for more than 10 minutes while deploying release 0.2.2 (aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa).

  - name: gate agent installation failure is classified and remains critical
    interval: 15s
    input_series:
      - series: 'hyperspace_control_plane_gate_agent_deployment_failure_info{job="hyperspace-control-plane-worker",cluster="mainnet",gate="gate-eu-lon-01",phase="failed",release_version="0.2.2",release_revision="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",artifact_sha256="bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb",probe_host="gate-eu-lon-01.hyperspace.zone",public_ipv4="192.0.2.10",failure_class="installation",failure_code="agent_release_download_failed"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 2m15s
        alertname: HyperspaceGateAgentInstallationFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              job: hyperspace-control-plane-worker
              cluster: mainnet
              gate: gate-eu-lon-01
              phase: failed
              release_version: 0.2.2
              release_revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              artifact_sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
              probe_host: gate-eu-lon-01.hyperspace.zone
              public_ipv4: 192.0.2.10
              failure_class: installation
              failure_code: agent_release_download_failed
            exp_annotations:
              summary: Hyperspace gate-agent installation failed
              description: Gate gate-eu-lon-01 could not install release 0.2.2 (aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa); failure code is agent_release_download_failed.

  - name: gate agent post install validation failure is critical
    interval: 15s
    input_series:
      - series: 'hyperspace_control_plane_gate_agent_deployment_failure_info{job="hyperspace-control-plane-worker",cluster="mainnet",gate="gate-eu-lon-01",phase="rolled_back",release_version="0.2.2",release_revision="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",artifact_sha256="bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb",probe_host="gate-eu-lon-01.hyperspace.zone",public_ipv4="192.0.2.10",failure_class="validation",failure_code="post_install_self_test_failed"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 2m15s
        alertname: HyperspaceGateAgentPostInstallValidationFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              job: hyperspace-control-plane-worker
              cluster: mainnet
              gate: gate-eu-lon-01
              phase: rolled_back
              release_version: 0.2.2
              release_revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              artifact_sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
              probe_host: gate-eu-lon-01.hyperspace.zone
              public_ipv4: 192.0.2.10
              failure_class: validation
              failure_code: post_install_self_test_failed
            exp_annotations:
              summary: Hyperspace gate-agent post-install validation failed
              description: Gate gate-eu-lon-01 did not validate release 0.2.2 (aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa); failure code is post_install_self_test_failed.

  - name: gate agent rollback is critical until a later deployment supersedes it
    interval: 15s
    input_series:
      - series: 'hyperspace_control_plane_gate_agent_deployment_latest_status{job="hyperspace-control-plane-worker",cluster="mainnet",gate="gate-eu-lon-01",phase="rolled_back",release_version="0.2.2",release_revision="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",artifact_sha256="bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb",probe_host="gate-eu-lon-01.hyperspace.zone",public_ipv4="192.0.2.10"}'
        values: '1x6'
    alert_rule_test:
      - eval_time: 1m15s
        alertname: HyperspaceGateAgentRollbackRequired
        exp_alerts:
          - exp_labels:
              severity: critical
              job: hyperspace-control-plane-worker
              cluster: mainnet
              gate: gate-eu-lon-01
              release_version: 0.2.2
              release_revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              artifact_sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
              probe_host: gate-eu-lon-01.hyperspace.zone
              public_ipv4: 192.0.2.10
            exp_annotations:
              summary: Hyperspace gate-agent rollback was required
              description: Gate gate-eu-lon-01 required rollback while deploying release 0.2.2 (aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa); inspect deployment history and the restored artifact before retrying.

  - name: stale control-plane snapshot is reported independently of worker scrape health
    interval: 15s
    input_series:
      - series: 'hyperspace_control_plane_snapshot_last_success_timestamp_seconds{job="hyperspace-control-plane-worker",cluster="mainnet",service_host="control-plane.hyperspace.zone",service_ipv4="192.0.2.5"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 2m15s
        alertname: HyperspaceControlPlaneSnapshotStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: hyperspace-control-plane-worker
              cluster: mainnet
              service_host: control-plane.hyperspace.zone
              service_ipv4: 192.0.2.5
            exp_annotations:
              summary: Hyperspace control-plane metrics snapshot is stale
              description: The worker has not completed a control-plane metrics snapshot for more than one minute; business-state alerts may be delayed.

  - name: repeated benchmark failures aggregate into one gate alert
    interval: 15s
    input_series:
      - series: 'hyperspace_control_plane_benchmark_gate_confirmed_failed_routes{job="hyperspace-control-plane-worker",cluster="mainnet",gate="gate-eu-lon-01",probe_host="gate-eu-lon-01.hyperspace.zone",public_ipv4="192.0.2.10"}'
        values: '3x4'
    alert_rule_test:
      - eval_time: 45s
        alertname: HyperspaceBenchmarkRouteFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: hyperspace-control-plane-worker
              cluster: mainnet
              gate: gate-eu-lon-01
              probe_host: gate-eu-lon-01.hyperspace.zone
              public_ipv4: 192.0.2.10
            exp_annotations:
              summary: Gate benchmark routes are repeatedly failing
              description: Gate gate-eu-lon-01 has 3 route/transport benchmarks failing for at least two consecutive cycles.

  - name: stale benchmark route retains both gate access endpoints
    interval: 1m
    input_series:
      - series: 'hyperspace_control_plane_benchmark_route_age_seconds{job="hyperspace-control-plane-worker",cluster="mainnet",route="gate-eu-lon-01 -> gate-na-mia-71",source_gate="gate-eu-lon-01",source_probe_host="gate-eu-lon-01.hyperspace.zone",source_public_ipv4="198.51.100.10",target_gate="gate-na-mia-71",target_probe_host="gate-na-mia-71.hyperspace.zone",target_public_ipv4="198.51.100.20",transport="public"}'
        values: '1000x12'
      - series: 'hyperspace_control_plane_gate_agent_connected{enabled="true",gate="gate-eu-lon-01"}'
        values: '1x12'
      - series: 'hyperspace_control_plane_gate_agent_connected{enabled="true",gate="gate-na-mia-71"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 11m
        alertname: HyperspaceBenchmarkRouteDataStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: hyperspace-control-plane-worker
              cluster: mainnet
              route: gate-eu-lon-01 -> gate-na-mia-71
              source_gate: gate-eu-lon-01
              source_probe_host: gate-eu-lon-01.hyperspace.zone
              source_public_ipv4: 198.51.100.10
              target_gate: gate-na-mia-71
              target_probe_host: gate-na-mia-71.hyperspace.zone
              target_public_ipv4: 198.51.100.20
              transport: public
            exp_annotations:
              summary: Gate benchmark route data is stale
              description: Route gate-eu-lon-01 -> gate-na-mia-71 has public benchmark data older than 15 minutes.

  - name: service host node exporter outage is critical
    interval: 15s
    input_series:
      - series: 'up{job="hyperspace-host-node",cluster="mainnet",role="observability",service_host="observability.hyperspace.zone",service_ipv4="84.32.83.71",instance="127.0.0.1:9100"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 2m15s
        alertname: HyperspaceHostNodeExporterDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: hyperspace-host-node
              cluster: mainnet
              role: observability
              service_host: observability.hyperspace.zone
              service_ipv4: 84.32.83.71
              instance: 127.0.0.1:9100
            exp_annotations:
              summary: Hyperspace service host metrics scrape is down
              description: Prometheus cannot scrape node exporter on the observability host observability.hyperspace.zone for 2 minutes.

  - name: service host root filesystem low space is critical
    interval: 15s
    input_series:
      - series: 'node_filesystem_avail_bytes{job="hyperspace-host-node",cluster="mainnet",role="observability",service_host="observability.hyperspace.zone",service_ipv4="84.32.83.71",instance="127.0.0.1:9100",mountpoint="/",fstype="ext4"}'
        values: '800000000x22'
      - series: 'node_filesystem_size_bytes{job="hyperspace-host-node",cluster="mainnet",role="observability",service_host="observability.hyperspace.zone",service_ipv4="84.32.83.71",instance="127.0.0.1:9100",mountpoint="/",fstype="ext4"}'
        values: '42949672960x22'
    alert_rule_test:
      - eval_time: 5m15s
        alertname: HyperspaceHostRootFilesystemCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              job: hyperspace-host-node
              cluster: mainnet
              role: observability
              service_host: observability.hyperspace.zone
              service_ipv4: 84.32.83.71
              instance: 127.0.0.1:9100
              mountpoint: /
              fstype: ext4
            exp_annotations:
              summary: Hyperspace service host root filesystem is critically full
              description: The observability host observability.hyperspace.zone has less than 5% or 1GiB available on /.

  - name: PostgreSQL exporter outage is critical
    interval: 15s
    input_series:
      - series: 'up{job="hyperspace-postgresql",cluster="staging",role="postgresql",service_host="db.staging.hyperspace.zone",service_ipv4="84.32.97.140",instance="10.179.228.4:9187"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 2m15s
        alertname: HyperspacePostgreSQLDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: hyperspace-postgresql
              cluster: staging
              role: postgresql
              service_host: db.staging.hyperspace.zone
              service_ipv4: 84.32.97.140
              instance: 10.179.228.4:9187
            exp_annotations:
              summary: Hyperspace PostgreSQL metrics scrape is down
              description: Prometheus cannot scrape postgres_exporter on db.staging.hyperspace.zone for 2 minutes.

  - name: failed snapshot section keeps worker scrapeable and alerts by section
    interval: 15s
    input_series:
      - series: 'up{job="hyperspace-control-plane-worker",cluster="staging",role="control-plane-worker",service_host="control-plane.staging.hyperspace.zone",service_ipv4="84.32.83.198",instance="84.32.83.198:9091"}'
        values: '1x10'
      - series: 'hyperspace_control_plane_snapshot_section_ready{job="hyperspace-control-plane-worker",cluster="staging",role="control-plane-worker",service_host="control-plane.staging.hyperspace.zone",service_ipv4="84.32.83.198",instance="84.32.83.198:9091",section="billing"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 1m15s
        alertname: HyperspaceControlPlaneSnapshotSectionFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: hyperspace-control-plane-worker
              cluster: staging
              role: control-plane-worker
              service_host: control-plane.staging.hyperspace.zone
              service_ipv4: 84.32.83.198
              instance: 84.32.83.198:9091
              section: billing
            exp_annotations:
              summary: Hyperspace control-plane snapshot section is failing
              description: The billing business metrics section has failed for more than one minute; other worker metrics remain available.

  - name: missing PostgreSQL backup is critical
    interval: 1m
    input_series:
      - series: 'hyperspace_postgres_backup_last_success_timestamp_seconds{job="hyperspace-host-node",cluster="testnet",role="postgresql",service_host="db.testnet.hyperspace.zone",service_ipv4="81.27.100.29",instance="81.27.100.29:9100"}'
        values: '0x32'
    alert_rule_test:
      - eval_time: 31m
        alertname: HyperspacePostgreSQLBackupMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              job: hyperspace-host-node
              cluster: testnet
              role: postgresql
              service_host: db.testnet.hyperspace.zone
              service_ipv4: 81.27.100.29
              instance: 81.27.100.29:9100
            exp_annotations:
              summary: Hyperspace PostgreSQL backup is missing
              description: No PostgreSQL custom-format dump is visible on db.testnet.hyperspace.zone.

  - name: configured offsite PostgreSQL backup without a success is critical
    interval: 1m
    input_series:
      - series: 'hyperspace_postgres_offsite_backup_configured{job="hyperspace-host-node",cluster="testnet",role="postgresql",service_host="db.testnet.hyperspace.zone",service_ipv4="81.27.100.29",instance="81.27.100.29:9100"}'
        values: '1x32'
      - series: 'hyperspace_postgres_offsite_backup_last_success_timestamp_seconds{job="hyperspace-host-node",cluster="testnet",role="postgresql",service_host="db.testnet.hyperspace.zone",service_ipv4="81.27.100.29",instance="81.27.100.29:9100"}'
        values: '0x32'
    alert_rule_test:
      - eval_time: 31m
        alertname: HyperspacePostgreSQLOffsiteBackupMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              job: hyperspace-host-node
              cluster: testnet
              role: postgresql
              service_host: db.testnet.hyperspace.zone
              service_ipv4: 81.27.100.29
              instance: 81.27.100.29:9100
            exp_annotations:
              summary: Hyperspace offsite PostgreSQL backup is missing
              description: No successful offsite PostgreSQL backup is recorded on db.testnet.hyperspace.zone.

  - name: missing staging PostgreSQL NFS backup storage is critical
    interval: 1m
    input_series:
      - series: 'up{job="hyperspace-host-node",cluster="staging",role="postgresql",service_host="db.staging.hyperspace.zone",service_ipv4="84.32.97.140",instance="10.179.228.4:9100"}'
        values: '1x8'
    alert_rule_test:
      - eval_time: 6m
        alertname: HyperspaceStagingPostgreSQLBackupStorageUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              job: hyperspace-host-node
              cluster: staging
              role: postgresql
              service_host: db.staging.hyperspace.zone
              service_ipv4: 84.32.97.140
              instance: 10.179.228.4:9100
            exp_annotations:
              summary: Hyperspace staging PostgreSQL backup storage is unavailable
              description: The NFS backup storage is not mounted on db.staging.hyperspace.zone; backup jobs fail closed instead of writing to the local root filesystem.

  - name: low staging PostgreSQL NFS backup storage is a warning
    interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{job="hyperspace-host-node",cluster="staging",role="postgresql",service_host="db.staging.hyperspace.zone",service_ipv4="84.32.97.140",instance="10.179.228.4:9100",mountpoint="/var/backups/hyperspace",fstype="nfs4"}'
        values: '53687091200x13'
      - series: 'node_filesystem_avail_bytes{job="hyperspace-host-node",cluster="staging",role="postgresql",service_host="db.staging.hyperspace.zone",service_ipv4="84.32.97.140",instance="10.179.228.4:9100",mountpoint="/var/backups/hyperspace",fstype="nfs4"}'
        values: '3221225472x13'
    alert_rule_test:
      - eval_time: 11m
        alertname: HyperspaceStagingPostgreSQLBackupStoragePressure
        exp_alerts:
          - exp_labels:
              severity: warning
              job: hyperspace-host-node
              cluster: staging
              role: postgresql
              service_host: db.staging.hyperspace.zone
              service_ipv4: 84.32.97.140
              instance: 10.179.228.4:9100
              mountpoint: /var/backups/hyperspace
              fstype: nfs4
            exp_annotations:
              summary: Hyperspace staging PostgreSQL backup storage is under pressure
              description: The staging NFS backup storage has less than 15% or 4GiB available.

  - name: stale offsite PostgreSQL backup is critical
    interval: 5m
    input_series:
      - series: 'hyperspace_postgres_offsite_backup_configured{job="hyperspace-host-node",cluster="testnet",role="postgresql",service_host="db.testnet.hyperspace.zone",service_ipv4="81.27.100.29",instance="81.27.100.29:9100"}'
        values: '1x440'
      - series: 'hyperspace_postgres_offsite_backup_last_success_timestamp_seconds{job="hyperspace-host-node",cluster="testnet",role="postgresql",service_host="db.testnet.hyperspace.zone",service_ipv4="81.27.100.29",instance="81.27.100.29:9100"}'
        values: '1x440'
    alert_rule_test:
      - eval_time: 36h20m
        alertname: HyperspacePostgreSQLOffsiteBackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              job: hyperspace-host-node
              cluster: testnet
              role: postgresql
              service_host: db.testnet.hyperspace.zone
              service_ipv4: 81.27.100.29
              instance: 81.27.100.29:9100
            exp_annotations:
              summary: Hyperspace offsite PostgreSQL backup is stale
              description: The latest successful offsite PostgreSQL backup from db.testnet.hyperspace.zone is older than 36 hours.

  - name: public HTTP probe outage is critical
    interval: 15s
    input_series:
      - series: 'probe_success{job="hyperspace-blackbox-http",cluster="mainnet",role="web",probe_name="app-home",service_host="app.hyperspace.zone",service_ipv4="84.32.83.69",instance="https://app.hyperspace.zone/"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 2m15s
        alertname: HyperspaceBlackboxHttpDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: hyperspace-blackbox-http
              cluster: mainnet
              role: web
              probe_name: app-home
              service_host: app.hyperspace.zone
              service_ipv4: 84.32.83.69
              instance: https://app.hyperspace.zone/
            exp_annotations:
              summary: Hyperspace public HTTP probe is failing
              description: Probe app-home for app.hyperspace.zone has failed for 2 minutes.

  - name: expiring TLS certificate emits warning
    interval: 15s
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{job="hyperspace-blackbox-http",cluster="mainnet",role="web",probe_name="app-home",service_host="app.hyperspace.zone",service_ipv4="84.32.83.69",instance="https://app.hyperspace.zone/"}'
        values: '1100000x370'
      - series: 'probe_success{job="hyperspace-blackbox-http",cluster="mainnet",role="web",probe_name="app-home",service_host="app.hyperspace.zone",service_ipv4="84.32.83.69",instance="https://app.hyperspace.zone/"}'
        values: '1x370'
    alert_rule_test:
