rule_files:
  - ../rules/hyperspace-db-isolation.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'hyperspace_probes_catalog_age_seconds{cluster="mainnet"}'
        values: '120+0x10'
      - series: 'hyperspace_probes_oldest_queued_age_seconds{cluster="mainnet"}'
        values: '700+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: HyperspaceProbesCatalogStale
        exp_alerts:
          - exp_labels:
              cluster: mainnet
              severity: warning
            exp_annotations:
              summary: MongoDB probes catalog is stale
              description: Probes fail closed after 60 seconds without a catalog refresh. Check the read-only core catalog connection and MongoDB writes. Do not change VPN or billing state to repair synthetic probes.
      - eval_time: 6m
        alertname: HyperspaceProbesQueueStalled
        exp_alerts:
          - exp_labels:
              cluster: mainnet
              severity: warning
            exp_annotations:
              summary: MongoDB probes queue is not progressing
              description: Synthetic jobs have waited more than 10 minutes. Check probe agent heartbeats, eligibility, leases and the probes scheduler. Core assignments use their independent PostgreSQL queue.
  - interval: 1m
    input_series:
      - series: 'hyperspace_probes_worker_loop_ready{job="hyperspace-probes-worker",loop="mongo-delivery",cluster="mainnet"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: HyperspaceMeasurementsMongoUnavailable
        exp_alerts:
          - exp_labels:
              job: hyperspace-probes-worker
              loop: mongo-delivery
              cluster: mainnet
              severity: warning
              role: mongodb
              service_host: hyperspace-probes-fra.ikxoorh.mongodb.net
            exp_annotations:
              summary: MongoDB measurement delivery is unavailable
              description: MongoDB probes storage or result projection is unavailable. Durable completed jobs will retry projection; agents may retry unacknowledged reports. Check Atlas cluster health, TLS/auth, IP access list and network access. Core VPN and billing are independent.
  - interval: 1m
    input_series:
      - series: 'hyperspace_measurements_mongo_data_bytes{cluster="mainnet",job="hyperspace-probes-worker",service_ipv4="5.199.161.13"}'
        values: '4200000000+0x15'
      - series: 'hyperspace_measurements_mongo_index_bytes{cluster="mainnet",job="hyperspace-probes-worker",service_ipv4="5.199.161.13"}'
        values: '400000000+0x15'
    alert_rule_test:
      - eval_time: 11m
        alertname: HyperspaceMeasurementsAtlasStorageHigh
        exp_alerts:
          - exp_labels:
              cluster: mainnet
              job: hyperspace-probes-worker
              severity: warning
              role: mongodb
              service_host: hyperspace-probes-fra.ikxoorh.mongodb.net
            exp_annotations:
              summary: Atlas Flex probes storage is approaching its limit
              description: Uncompressed MongoDB data plus indexes exceed 4 GB. Atlas Flex has a 5 GB limit; check TTL and index growth before writes are affected.
      - eval_time: 6m
        alertname: HyperspaceMeasurementsAtlasStorageCritical
        exp_alerts:
          - exp_labels:
              cluster: mainnet
              job: hyperspace-probes-worker
              severity: critical
              role: mongodb
              service_host: hyperspace-probes-fra.ikxoorh.mongodb.net
            exp_annotations:
              summary: Atlas Flex probes storage is nearly full
              description: Uncompressed MongoDB data plus indexes exceed 4.5 GB of the 5 GB Flex limit. Check retention immediately or explicitly upgrade the Atlas tier; core financial data must remain in PostgreSQL.
  - interval: 1m
    input_series:
      - series: 'hyperspace_measurements_delivery_oldest_age_seconds{cluster="mainnet"}'
        values: '600+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: HyperspaceMeasurementsDeliveryBacklog
        exp_alerts:
          - exp_labels:
              cluster: mainnet
              severity: warning
            exp_annotations:
              summary: Measurement delivery journal is accumulating reports
              description: Check MongoDB availability and delivery throughput. Completed probes have pending result projections; do not delete their durable journal or financial data.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="hyperspace-host-node",role="mongodb",mountpoint="/"}'
        values: '3221225472+0x15'
      - series: 'node_filesystem_size_bytes{job="hyperspace-host-node",role="mongodb",mountpoint="/"}'
        values: '42949672960+0x15'
    alert_rule_test:
      - eval_time: 11m
        alertname: HyperspaceMeasurementsMongoDiskCritical
        exp_alerts:
          - exp_labels:
              job: hyperspace-host-node
              role: mongodb
              mountpoint: /
              severity: critical
            exp_annotations:
              summary: MongoDB measurement host is running out of disk space
              description: Less than 4 GiB or 15% free disk remains on the MongoDB host. Check TTL, indexes and log rotation; do not move financial data here.
  - interval: 1m
    input_series:
      - series: 'up{job="hyperspace-probes-worker",cluster="mainnet",role="probes-worker",service_host="control-plane.hyperspace.zone"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: HyperspaceProbesWorkerDown
        exp_alerts:
          - exp_labels:
              job: hyperspace-probes-worker
              cluster: mainnet
              role: probes-worker
              service_host: control-plane.hyperspace.zone
              severity: warning
            exp_annotations:
              summary: Optional probes worker is unavailable
              description: Benchmarks/trading measurements may be stale. Core VPN, billing and reconciliation run independently. Check probes-worker on control-plane.hyperspace.zone.
  - interval: 1m
    input_series:
      - series: 'hyperspace_postgres_restore_check_last_success_timestamp_seconds{cluster="mainnet"}'
        values: '-864000+0x40'
    alert_rule_test:
      - eval_time: 31m
        alertname: HyperspacePostgreSQLRestoreCheckStale
        exp_alerts:
          - exp_labels:
              cluster: mainnet
              severity: critical
            exp_annotations:
              summary: Core backup has not passed a recent full restore drill
              description: Core restore verification exceeds its configured maximum age (9 days by default; 35 days for monthly drills). Check hyperspace-db-restore-check.service, latest backup checksum, offsite storage access and free restore spool space.
