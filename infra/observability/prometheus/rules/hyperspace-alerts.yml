groups:
  - name: hyperspace-gate-recording
    interval: 1m
    rules:
      - record: hyperspace:gate_physical_receive_bytes:rate5m
        expr: rate(hyperspace_gate_physical_receive_bytes_total{job="hyperspace-gate-node"}[5m])

      - record: hyperspace:gate_physical_transmit_bytes:rate5m
        expr: rate(hyperspace_gate_physical_transmit_bytes_total{job="hyperspace-gate-node"}[5m])

      - record: hyperspace:gate_physical_receive_bytes:increase1d
        expr: increase(hyperspace_gate_physical_receive_bytes_total{job="hyperspace-gate-node"}[1d])

      - record: hyperspace:gate_physical_transmit_bytes:increase1d
        expr: increase(hyperspace_gate_physical_transmit_bytes_total{job="hyperspace-gate-node"}[1d])

      - record: hyperspace:gate_doublezero_receive_bytes:rate5m
        expr: rate(hyperspace_gate_doublezero_receive_bytes_total{job="hyperspace-gate-node"}[5m])

      - record: hyperspace:gate_doublezero_transmit_bytes:rate5m
        expr: rate(hyperspace_gate_doublezero_transmit_bytes_total{job="hyperspace-gate-node"}[5m])

      - record: hyperspace:gate_physical_packets:rate5m
        expr: |
          sum by (cluster, gate) (
            rate(node_network_receive_packets_total{job="hyperspace-gate-node",device!="lo"}[5m])
            + rate(node_network_transmit_packets_total{job="hyperspace-gate-node",device!="lo"}[5m])
          )

      - record: hyperspace:assignment_forwarded_bytes:increase1h
        expr: increase(hyperspace_control_plane_assignment_forwarded_bytes_total[1h])

      - record: hyperspace:assignment_dropped_bytes:increase1h
        expr: increase(hyperspace_control_plane_assignment_dropped_bytes_total[1h])

  - name: hyperspace-control-plane
    rules:
      - alert: HyperspaceHostNodeExporterDown
        expr: up{job="hyperspace-host-node"} == 0
        for: 2m
        keep_firing_for: 10m
        labels:
          severity: critical
        annotations:
          summary: Hyperspace service host metrics scrape is down
          description: Prometheus cannot scrape node exporter on the {{ $labels.role }} host {{ $labels.service_host }} for 2 minutes.

      - alert: HyperspaceHostRootFilesystemPressure
        expr: |
          (
            node_filesystem_avail_bytes{job="hyperspace-host-node",mountpoint="/",fstype!~"tmpfs|overlay"}
              / node_filesystem_size_bytes{job="hyperspace-host-node",mountpoint="/",fstype!~"tmpfs|overlay"} < 0.15
          )
          or
          node_filesystem_avail_bytes{job="hyperspace-host-node",mountpoint="/",fstype!~"tmpfs|overlay"} < 4294967296
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Hyperspace service host root filesystem is under pressure
          description: The {{ $labels.role }} host {{ $labels.service_host }} has less than 15% or 4GiB available on /.

      - alert: HyperspaceHostRootFilesystemCritical
        expr: |
          (
            node_filesystem_avail_bytes{job="hyperspace-host-node",mountpoint="/",fstype!~"tmpfs|overlay"}
              / node_filesystem_size_bytes{job="hyperspace-host-node",mountpoint="/",fstype!~"tmpfs|overlay"} < 0.05
          )
          or
          node_filesystem_avail_bytes{job="hyperspace-host-node",mountpoint="/",fstype!~"tmpfs|overlay"} < 1073741824
        for: 5m
        keep_firing_for: 30m
        labels:
          severity: critical
        annotations:
          summary: Hyperspace service host root filesystem is critically full
          description: The {{ $labels.role }} host {{ $labels.service_host }} has less than 5% or 1GiB available on /.

      - alert: HyperspaceHostInodePressure
        expr: |
          node_filesystem_files_free{job="hyperspace-host-node",mountpoint="/",fstype!~"tmpfs|overlay"}
            / node_filesystem_files{job="hyperspace-host-node",mountpoint="/",fstype!~"tmpfs|overlay"} < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Hyperspace service host inode headroom is low
          description: The {{ $labels.role }} host {{ $labels.service_host }} has less than 15% free inodes on /.

      - alert: HyperspaceHostInodeCritical
        expr: |
          node_filesystem_files_free{job="hyperspace-host-node",mountpoint="/",fstype!~"tmpfs|overlay"}
            / node_filesystem_files{job="hyperspace-host-node",mountpoint="/",fstype!~"tmpfs|overlay"} < 0.05
        for: 5m
        keep_firing_for: 30m
        labels:
          severity: critical
        annotations:
          summary: Hyperspace service host inodes are critically exhausted
          description: The {{ $labels.role }} host {{ $labels.service_host }} has less than 5% free inodes on /.

      - alert: HyperspaceHostMemoryPressure
        expr: |
          (
            node_memory_MemAvailable_bytes{job="hyperspace-host-node"}
              / node_memory_MemTotal_bytes{job="hyperspace-host-node"} < 0.20
          )
          or
          node_memory_MemAvailable_bytes{job="hyperspace-host-node"} < 268435456
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Hyperspace service host memory headroom is low
          description: The {{ $labels.role }} host {{ $labels.service_host }} has less than 20% or 256MiB available RAM.

      - alert: HyperspaceHostMemoryCritical
        expr: |
          (
            node_memory_MemAvailable_bytes{job="hyperspace-host-node"}
              / node_memory_MemTotal_bytes{job="hyperspace-host-node"} < 0.10
          )
          or
          node_memory_MemAvailable_bytes{job="hyperspace-host-node"} < 134217728
        for: 30s
        keep_firing_for: 10m
        labels:
          severity: critical
        annotations:
          summary: Hyperspace service host memory is critically low
          description: The {{ $labels.role }} host {{ $labels.service_host }} has less than 10% or 128MiB available RAM.

      - alert: HyperspaceHostOOMKill
        expr: increase(node_vmstat_oom_kill{job="hyperspace-host-node"}[5m]) > 0
        keep_firing_for: 30m
        labels:
          severity: critical
        annotations:
          summary: Linux OOM killer terminated a process on a Hyperspace service host
          description: The {{ $labels.role }} host {{ $labels.service_host }} reported at least one OOM kill during the last 5 minutes.

      - alert: HyperspaceHostCpuSustained
        expr: |
          100 * (1 - avg by (cluster, role, service_host, service_ipv4, instance) (
            rate(node_cpu_seconds_total{job="hyperspace-host-node",mode="idle"}[5m])
          )) > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Hyperspace service host CPU usage is sustained above 90%
          description: The {{ $labels.role }} host {{ $labels.service_host }} has averaged more than 90% CPU usage for 15 minutes.

      - alert: HyperspaceControlPlaneApiDown
        expr: up{job="hyperspace-control-plane-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Hyperspace control-plane API metrics scrape is down
          description: Prometheus cannot scrape the control-plane API metrics endpoint for 2 minutes.

      - alert: HyperspaceControlPlaneWorkerDown
        expr: up{job="hyperspace-control-plane-worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Hyperspace control-plane worker metrics scrape is down
          description: Prometheus cannot scrape the worker observability endpoint for 2 minutes.

      - alert: HyperspacePostgreSQLDown
        expr: up{job="hyperspace-postgresql"} == 0
        for: 2m
        keep_firing_for: 10m
        labels:
          severity: critical
        annotations:
          summary: Hyperspace PostgreSQL metrics scrape is down
          description: Prometheus cannot scrape postgres_exporter on {{ $labels.service_host }} for 2 minutes.

      - alert: HyperspacePostgreSQLConnectionsPressure
        expr: |
          hyperspace_postgres_connections{job="hyperspace-host-node"}
            / hyperspace_postgres_max_connections{job="hyperspace-host-node"} > 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Hyperspace PostgreSQL connections are above 80%
          description: PostgreSQL on {{ $labels.service_host }} has used more than 80% of max_connections for 10 minutes.

      - alert: HyperspacePostgreSQLConnectionsCritical
        expr: |
          hyperspace_postgres_connections{job="hyperspace-host-node"}
            / hyperspace_postgres_max_connections{job="hyperspace-host-node"} > 0.95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Hyperspace PostgreSQL connections are critically high
          description: PostgreSQL on {{ $labels.service_host }} has used more than 95% of max_connections for 2 minutes.

      - alert: HyperspacePostgreSQLLongTransaction
        expr: hyperspace_postgres_longest_transaction_seconds{job="hyperspace-host-node"} > 300
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Hyperspace PostgreSQL has a long-running transaction
          description: PostgreSQL on {{ $labels.service_host }} has an active transaction older than 5 minutes.

      - alert: HyperspacePostgreSQLLongTransactionCritical
        expr: hyperspace_postgres_longest_transaction_seconds{job="hyperspace-host-node"} > 1800
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Hyperspace PostgreSQL transaction is critically old
          description: PostgreSQL on {{ $labels.service_host }} has an active transaction older than 30 minutes.

      - alert: HyperspacePostgreSQLAutovacuumBacklog
        expr: hyperspace_postgres_tables_requiring_vacuum{job="hyperspace-host-node"} > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Hyperspace PostgreSQL tables need vacuum attention
          description: PostgreSQL on {{ $labels.service_host }} has tables above the dead-tuple autovacuum threshold for 30 minutes.

      - alert: HyperspacePostgreSQLTransactionIdAgeCritical
        expr: hyperspace_postgres_oldest_xid_age{job="hyperspace-host-node"} > 1000000000
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Hyperspace PostgreSQL transaction ID age is critical
          description: PostgreSQL on {{ $labels.service_host }} has a relation transaction ID age above one billion.

      - alert: HyperspacePostgreSQLDatabaseGrowth
        expr: |
          (
            hyperspace_postgres_database_size_bytes{job="hyperspace-host-node"}
              - hyperspace_postgres_database_size_bytes{job="hyperspace-host-node"} offset 24h
          ) > 1073741824
          and
          (
            hyperspace_postgres_database_size_bytes{job="hyperspace-host-node"}
              / hyperspace_postgres_database_size_bytes{job="hyperspace-host-node"} offset 24h
          ) > 1.20
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Hyperspace PostgreSQL database grew rapidly
          description: PostgreSQL on {{ $labels.service_host }} grew by more than 1GiB and 20% during the last 24 hours.

      - alert: HyperspacePostgreSQLWalPressure
        expr: hyperspace_postgres_wal_size_bytes{job="hyperspace-host-node"} > 4294967296
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Hyperspace PostgreSQL WAL directory is large
          description: PostgreSQL on {{ $labels.service_host }} has more than 4GiB in pg_wal.

      - alert: HyperspacePostgreSQLWalCritical
        expr: hyperspace_postgres_wal_size_bytes{job="hyperspace-host-node"} > 8589934592
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Hyperspace PostgreSQL WAL directory is critically large
          description: PostgreSQL on {{ $labels.service_host }} has more than 8GiB in pg_wal.

      - alert: HyperspacePostgreSQLBackupStale
        expr: |
          hyperspace_postgres_backup_last_success_timestamp_seconds{job="hyperspace-host-node"} > 0
          and
          time() - hyperspace_postgres_backup_last_success_timestamp_seconds{job="hyperspace-host-node"} > 129600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Hyperspace PostgreSQL backup is stale
          description: The newest PostgreSQL dump on {{ $labels.service_host }} is older than 36 hours.

      - alert: HyperspacePostgreSQLBackupMissing
        expr: hyperspace_postgres_backup_last_success_timestamp_seconds{job="hyperspace-host-node"} == 0
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: Hyperspace PostgreSQL backup is missing
          description: No PostgreSQL custom-format dump is visible on {{ $labels.service_host }}.

      - alert: HyperspacePostgreSQLBackupCritical
        expr: |
          hyperspace_postgres_backup_last_success_timestamp_seconds{job="hyperspace-host-node"} > 0
          and
          time() - hyperspace_postgres_backup_last_success_timestamp_seconds{job="hyperspace-host-node"} > 259200
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Hyperspace PostgreSQL backup is critically stale
          description: The newest PostgreSQL dump on {{ $labels.service_host }} is older than 72 hours.

      - alert: HyperspacePostgreSQLHealthMetricsStale
        expr: time() - hyperspace_postgres_health_exporter_last_run_timestamp_seconds{job="hyperspace-host-node"} > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Hyperspace PostgreSQL health metrics are stale
          description: The PostgreSQL health collector on {{ $labels.service_host }} has not completed for more than 5 minutes.

      - alert: HyperspaceBlackboxHttpDown
        expr: probe_success{job="hyperspace-blackbox-http"} == 0
        for: 2m
        keep_firing_for: 5m
        labels:
          severity: critical
        annotations:
          summary: Hyperspace public HTTP probe is failing
          description: Probe {{ $labels.probe_name }} for {{ $labels.service_host }} has failed for 2 minutes.

      - alert: HyperspacePostgreSQLTcpDown
        expr: probe_success{job="hyperspace-blackbox-postgresql"} == 0
        for: 2m
        keep_firing_for: 5m
        labels:
          severity: critical
        annotations:
          summary: Hyperspace PostgreSQL TCP probe is failing
          description: The cluster observability host cannot establish TCP/5432 to {{ $labels.service_host }}.

      - alert: HyperspaceTlsCertificateExpiring
        expr: |
          probe_ssl_earliest_cert_expiry{job="hyperspace-blackbox-http"} - time() < 1209600
          and
          probe_success{job="hyperspace-blackbox-http"} == 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Hyperspace TLS certificate expires within 14 days
          description: The TLS certificate checked by {{ $labels.probe_name }} for {{ $labels.service_host }} expires within 14 days.

      - alert: HyperspaceTlsCertificateCritical
        expr: |
          probe_ssl_earliest_cert_expiry{job="hyperspace-blackbox-http"} - time() < 259200
          and
          probe_success{job="hyperspace-blackbox-http"} == 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Hyperspace TLS certificate expires within 3 days
          description: The TLS certificate checked by {{ $labels.probe_name }} for {{ $labels.service_host }} expires within 3 days.

      - alert: HyperspaceControlPlaneSnapshotStale
        expr: time() - hyperspace_control_plane_snapshot_last_success_timestamp_seconds > 60
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Hyperspace control-plane metrics snapshot is stale
          description: The worker has not completed a control-plane metrics snapshot for more than one minute; business-state alerts may be delayed.

      - alert: HyperspaceTooFewSchedulableGates
        expr: hyperspace_control_plane_gates_total{state="schedulable"} < 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Too few schedulable Hyperspace gates
          description: Fewer than two gates are schedulable, so new ingress/egress VPN paths cannot be safely provisioned.

      - alert: HyperspaceEnabledGateAgentDisconnected
        expr: hyperspace_control_plane_gate_agent_connected{enabled="true"} == 0
        for: 5m
        keep_firing_for: 10m
        labels:
          severity: critical
        annotations:
          summary: Enabled Hyperspace gate agent is disconnected
          description: Gate {{ $labels.gate }} is enabled but its agent condition or heartbeat lease is not fresh.

      - alert: HyperspaceEnabledGateNotReady
        expr: |
          (hyperspace_control_plane_gate_ready{enabled="true"} == 0)
          and on(gate)
            (hyperspace_control_plane_gate_agent_connected{enabled="true"} == 1)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Enabled Hyperspace gate is not ready
          description: Gate {{ $labels.gate }} is enabled but does not satisfy the Ready condition.

      - alert: HyperspaceEnabledGateDoubleZeroNotReady
        expr: |
          (hyperspace_control_plane_gate_doublezero_ready{enabled="true"} == 0)
          and on(gate)
            (hyperspace_control_plane_gate_agent_connected{enabled="true"} == 1)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Enabled Hyperspace gate DoubleZero readiness failed
          description: Gate {{ $labels.gate }} is enabled but DoubleZero tunnel state is not ready.

      - alert: HyperspaceGateNodeExporterDown
        expr: up{job="hyperspace-gate-node"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Hyperspace gate host metrics scrape is down
          description: Prometheus cannot scrape node exporter on gate {{ $labels.gate }} for 5 minutes.

      - alert: HyperspaceEnabledGateMissingFromDiscovery
        expr: |
          hyperspace_control_plane_gate_agent_connected{enabled="true"}
          unless on(gate)
          up{job="hyperspace-gate-node"}
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Enabled Hyperspace gate is missing from Prometheus discovery
          description: Gate {{ $labels.gate }} is enabled in the control-plane catalog but has no node-exporter target.

      - alert: HyperspaceGateDiscoveryCountMismatch
        expr: |
          hyperspace_control_plane_gates_total{state="enabled"}
            != scalar(count(up{job="hyperspace-gate-node"}) or vector(0))
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Gate catalog and Prometheus discovery counts differ
          description: The enabled gate count does not match the number of discovered node-exporter targets.

      - alert: HyperspaceGateResourceExporterMissing
        expr: |
          (up{job="hyperspace-gate-node"} == 1)
          unless on(gate)
          hyperspace_gate_resource_exporter_last_run_timestamp_seconds{job="hyperspace-gate-node"}
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Hyperspace gate resource metrics are missing
          description: Node exporter is reachable on gate {{ $labels.gate }}, but the Hyperspace resource exporter has not produced metrics.

      - alert: HyperspaceGateResourceExporterStale
        expr: time() - hyperspace_gate_resource_exporter_last_run_timestamp_seconds{job="hyperspace-gate-node"} > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Hyperspace gate resource metrics are stale
          description: Gate {{ $labels.gate }} has not refreshed resource metrics for more than 5 minutes.

      - alert: HyperspaceGateConntrackPressure
        expr: |
          hyperspace_gate_conntrack_entries{job="hyperspace-gate-node"}
            / hyperspace_gate_conntrack_limit{job="hyperspace-gate-node"} >= 0.70
          and
          hyperspace_gate_conntrack_entries{job="hyperspace-gate-node"}
            / hyperspace_gate_conntrack_limit{job="hyperspace-gate-node"} < 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Hyperspace gate conntrack utilization is high
          description: Gate {{ $labels.gate }} has used at least 70% of its conntrack table.

      - alert: HyperspaceGateConntrackCritical
        expr: |
          hyperspace_gate_conntrack_entries{job="hyperspace-gate-node"}
            / hyperspace_gate_conntrack_limit{job="hyperspace-gate-node"} >= 0.90
        for: 1m
        keep_firing_for: 10m
        labels:
          severity: critical
        annotations:
          summary: Hyperspace gate conntrack table is critically full
          description: Gate {{ $labels.gate }} has used at least 90% of its conntrack table and may drop new connections.

      - alert: HyperspaceGateConntrackTableFull
        expr: hyperspace_gate_conntrack_table_full_events_recent{job="hyperspace-gate-node"} > 0
        keep_firing_for: 30m
        labels:
          severity: critical
        annotations:
          summary: Linux dropped packets because a gate conntrack table was full
          description: Gate {{ $labels.gate }} logged at least one nf_conntrack table-full event in the last two minutes.

      - alert: HyperspaceGateConntrackAccountingDisabled
        expr: hyperspace_gate_conntrack_accounting_enabled{job="hyperspace-gate-node"} != 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Conntrack accounting is disabled on a Hyperspace gate
          description: Gate {{ $labels.gate }} is not collecting per-flow conntrack byte and packet counters.

      - alert: HyperspaceGateNetworkDrops
        expr: |
          sum by (cluster, gate, public_ipv4, probe_host) (
            rate(node_network_receive_drop_total{job="hyperspace-gate-node",device!="lo"}[5m])
            + rate(node_network_transmit_drop_total{job="hyperspace-gate-node",device!="lo"}[5m])
            + rate(node_network_receive_errs_total{job="hyperspace-gate-node",device!="lo"}[5m])
            + rate(node_network_transmit_errs_total{job="hyperspace-gate-node",device!="lo"}[5m])
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Sustained network drops or errors on a Hyperspace gate
          description: Gate {{ $labels.gate }} reports more than one network drop or error per second for 5 minutes.

      - alert: HyperspaceGateUdpBufferErrors
        expr: |
          increase(hyperspace_gate_udp_receive_buffer_errors_total{job="hyperspace-gate-node"}[5m])
          + increase(hyperspace_gate_udp_send_buffer_errors_total{job="hyperspace-gate-node"}[5m]) > 0
        keep_firing_for: 15m
        labels:
          severity: warning
        annotations:
          summary: UDP socket buffer errors on a Hyperspace gate
          description: Gate {{ $labels.gate }} dropped UDP traffic because a receive or send buffer was exhausted.

      - alert: HyperspaceGateSoftnetDrops
        expr: increase(hyperspace_gate_softnet_dropped_total{job="hyperspace-gate-node"}[5m]) > 0
        keep_firing_for: 15m
        labels:
          severity: warning
        annotations:
          summary: Linux softnet backlog dropped packets on a Hyperspace gate
          description: Gate {{ $labels.gate }} dropped packets in the kernel network backlog.

      - alert: HyperspaceGateCpuSustained
        expr: |
          100 * (1 - avg by (cluster, gate, public_ipv4, probe_host) (
            rate(node_cpu_seconds_total{job="hyperspace-gate-node",mode="idle"}[5m])
          )) > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Sustained CPU saturation on a Hyperspace gate
          description: Gate {{ $labels.gate }} has used more than 90% CPU for 15 minutes.

      - alert: HyperspaceGateTrafficCapacityPressure
        expr: |
          8 * sum by (cluster, gate, public_ipv4, probe_host) (
            rate(hyperspace_gate_physical_receive_bytes_total{job="hyperspace-gate-node"}[5m])
            + rate(hyperspace_gate_physical_transmit_bytes_total{job="hyperspace-gate-node"}[5m])
          ) > 750000000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Hyperspace gate traffic is approaching a 1 Gbit/s host limit
          description: Gate {{ $labels.gate }} has sustained more than 750 Mbit/s aggregate physical traffic for 10 minutes.

      - alert: HyperspaceGatePacketRatePressure
        expr: |
          sum by (cluster, gate, public_ipv4, probe_host) (
            rate(node_network_receive_packets_total{job="hyperspace-gate-node",device!="lo"}[5m])
            + rate(node_network_transmit_packets_total{job="hyperspace-gate-node",device!="lo"}[5m])
          ) > 200000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Hyperspace gate packet rate is unusually high
          description: Gate {{ $labels.gate }} has sustained more than 200,000 aggregate physical packets per second for 10 minutes.

      - alert: HyperspaceGateVnstatUnavailable
        expr: hyperspace_gate_vnstat_service_up{job="hyperspace-gate-node"} != 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Persistent traffic accounting is unavailable on a Hyperspace gate
          description: vnstatd is not active on gate {{ $labels.gate }}.

      - alert: HyperspaceGateVnstatDatabaseStale
        expr: time() - hyperspace_gate_vnstat_database_mtime_seconds{job="hyperspace-gate-node"} > 1200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Persistent traffic accounting is stale on a Hyperspace gate
          description: The vnstat database on gate {{ $labels.gate }} has not been updated for more than 20 minutes.

      - alert: HyperspaceGateDoubleZeroMetricsUnavailable
        expr: hyperspace_gate_doublezero_metrics_last_scrape_success{job="hyperspace-gate-node"} != 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Aggregate DoubleZero metrics are unavailable on a Hyperspace gate
          description: Gate {{ $labels.gate }} cannot scrape the local DoubleZero metrics endpoint.

      - alert: HyperspaceGateDoubleZeroRouteErrors
        expr: |
          increase(doublezero_liveness_route_install_failures_total{job="hyperspace-gate-node"}[5m])
          + increase(doublezero_liveness_route_uninstall_failures_total{job="hyperspace-gate-node"}[5m]) > 0
        keep_firing_for: 15m
        labels:
          severity: warning
        annotations:
          summary: DoubleZero route reconciliation errors on a Hyperspace gate
          description: Gate {{ $labels.gate }} reported a DoubleZero route install or uninstall failure.

      - alert: HyperspaceGateDoubleZeroSocketErrors
        expr: |
          increase(doublezero_liveness_read_socket_errors_total{job="hyperspace-gate-node"}[5m])
          + increase(doublezero_liveness_write_socket_errors_total{job="hyperspace-gate-node"}[5m]) > 0
        keep_firing_for: 15m
        labels:
          severity: warning
        annotations:
          summary: DoubleZero route-liveness socket errors on a Hyperspace gate
          description: Gate {{ $labels.gate }} reported route-liveness socket read or write errors.

      - alert: HyperspaceAssignmentCountersStale
        expr: hyperspace_control_plane_assignment_counter_age_seconds{active="true"} > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Active gate assignment counters are stale
          description: Assignment {{ $labels.assignment_id }} on gate {{ $labels.gate }} has not persisted a counter sample for more than 5 minutes.

      - alert: HyperspaceAssignmentPolicyDrops
        expr: increase(hyperspace_control_plane_assignment_dropped_bytes_total{active="true"}[5m]) > 0
        keep_firing_for: 15m
        labels:
          severity: warning
        annotations:
          summary: Gate assignment policy dropped traffic
          description: Assignment {{ $labels.assignment_id }} on gate {{ $labels.gate }} dropped traffic outside its allowed forwarding policy.

      - alert: HyperspaceGateRootFilesystemCritical
        expr: |
          (
            node_filesystem_avail_bytes{job="hyperspace-gate-node", mountpoint="/"}
              / node_filesystem_size_bytes{job="hyperspace-gate-node", mountpoint="/"} < 0.05
          )
          or
          node_filesystem_avail_bytes{job="hyperspace-gate-node", mountpoint="/"} < 536870912
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Hyperspace gate root filesystem is critically full
          description: Gate {{ $labels.gate }} has less than 5% or 512MiB available on the root filesystem.

      - alert: HyperspaceGateMemoryCritical
        expr: |
          (
            node_memory_MemAvailable_bytes{job="hyperspace-gate-node"}
              / node_memory_MemTotal_bytes{job="hyperspace-gate-node"} < 0.10
          )
          or
          node_memory_MemAvailable_bytes{job="hyperspace-gate-node"} < 134217728
        for: 30s
        keep_firing_for: 10m
        labels:
          severity: critical
        annotations:
          summary: Hyperspace gate memory is critically low
          description: Gate {{ $labels.gate }} has less than 10% or 128MiB available RAM.

      - alert: HyperspaceGateMemoryPressure
        expr: |
          (
            node_memory_MemAvailable_bytes{job="hyperspace-gate-node"}
              / node_memory_MemTotal_bytes{job="hyperspace-gate-node"} < 0.20
          )
          or
          node_memory_MemAvailable_bytes{job="hyperspace-gate-node"} < 268435456
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Hyperspace gate memory headroom is low
          description: Gate {{ $labels.gate }} has less than 20% or 256MiB available RAM.

      - alert: HyperspaceGateOOMKill
        expr: increase(node_vmstat_oom_kill{job="hyperspace-gate-node"}[5m]) > 0
        keep_firing_for: 30m
        labels:
          severity: critical
        annotations:
          summary: Linux OOM killer terminated a process on a Hyperspace gate
          description: Gate {{ $labels.gate }} reported at least one OOM kill during the last 5 minutes.

      - alert: HyperspaceGateRuntimeFilesystemPressure
        expr: |
          (
            hyperspace_gate_runtime_filesystem_last_before_used_percent{job="hyperspace-gate-node"} >= 70
          )
          and
          (
            hyperspace_gate_runtime_filesystem_last_before_used_percent{job="hyperspace-gate-node"} < 85
          )
        keep_firing_for: 5m
        labels:
          severity: warning
        annotations:
          summary: Hyperspace gate runtime filesystem is under pressure
          description: Gate {{ $labels.gate }} reached at least 70% usage on /run; the local janitor attempted recovery.

      - alert: HyperspaceGateRuntimeFilesystemCritical
        expr: |
          (
            hyperspace_gate_runtime_filesystem_last_before_used_percent{job="hyperspace-gate-node"} >= 85
          )
          or
          (
            hyperspace_gate_runtime_filesystem_last_after_used_percent{job="hyperspace-gate-node"} >= 85
          )
        keep_firing_for: 10m
        labels:
          severity: critical
        annotations:
          summary: Hyperspace gate runtime filesystem is critically full
          description: Gate {{ $labels.gate }} reached at least 85% usage on /run, which can prevent login and service operation.

      - alert: HyperspaceGateDiskJanitorStale
        expr: time() - hyperspace_gate_disk_janitor_last_run_timestamp_seconds{job="hyperspace-gate-node"} > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Hyperspace gate disk janitor is stale
          description: Gate {{ $labels.gate }} has not reported a disk janitor run for more than 5 minutes.

      - alert: HyperspaceGateDiskJanitorFailed
        expr: hyperspace_gate_disk_janitor_last_success{job="hyperspace-gate-node"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Hyperspace gate disk janitor failed
          description: Gate {{ $labels.gate }} reported a failed disk janitor run.

      - alert: HyperspaceDeadJobsPresent
        expr: sum(hyperspace_control_plane_jobs_total{phase="dead"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Dead control-plane jobs are present
          description: At least one control-plane job reached the dead terminal phase and needs operator review.

      - alert: HyperspaceGateAgentDeploymentStalled
        expr: hyperspace_control_plane_gate_agent_deployment_active_age_seconds > 600
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Hyperspace gate-agent deployment is stalled
          description: Gate {{ $labels.gate }} has remained in {{ $labels.phase }} for more than 10 minutes while deploying release {{ $labels.release_version }} ({{ $labels.release_revision }}).

      - alert: HyperspaceGateAgentInstallationFailed
        expr: hyperspace_control_plane_gate_agent_deployment_failure_info{failure_class="installation"} == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Hyperspace gate-agent installation failed
          description: Gate {{ $labels.gate }} could not install release {{ $labels.release_version }} ({{ $labels.release_revision }}); failure code is {{ $labels.failure_code }}.

      - alert: HyperspaceGateAgentPostInstallValidationFailed
        expr: hyperspace_control_plane_gate_agent_deployment_failure_info{failure_class="validation"} == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Hyperspace gate-agent post-install validation failed
          description: Gate {{ $labels.gate }} did not validate release {{ $labels.release_version }} ({{ $labels.release_revision }}); failure code is {{ $labels.failure_code }}.

      - alert: HyperspaceGateAgentDeploymentFailed
        expr: hyperspace_control_plane_gate_agent_deployment_failure_info{failure_class="other"} == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Hyperspace gate-agent deployment failed
          description: Gate {{ $labels.gate }} failed release {{ $labels.release_version }} ({{ $labels.release_revision }}) with {{ $labels.failure_code }}.

      - alert: HyperspaceGateAgentRollbackRequired
        expr: max without (phase) (hyperspace_control_plane_gate_agent_deployment_latest_status{phase=~"rollback_requested|rolling_back|rolled_back"}) == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Hyperspace gate-agent rollback was required
          description: Gate {{ $labels.gate }} required rollback while deploying release {{ $labels.release_version }} ({{ $labels.release_revision }}); inspect deployment history and the restored artifact before retrying.

      - alert: HyperspaceBenchmarkRouteFailed
        expr: hyperspace_control_plane_benchmark_gate_confirmed_failed_routes > 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Gate benchmark routes are repeatedly failing
          description: Gate {{ $labels.gate }} has {{ printf "%.0f" $value }} route/transport benchmarks failing for at least two consecutive cycles.

      - alert: HyperspaceBenchmarkRouteDataStale
        expr: |
          (hyperspace_control_plane_benchmark_route_age_seconds > 900)
          and on(source_gate)
            label_replace(
              hyperspace_control_plane_gate_agent_connected{enabled="true"} == 1,
              "source_gate",
              "$1",
              "gate",
              "(.*)"
            )
          and on(target_gate)
            label_replace(
              hyperspace_control_plane_gate_agent_connected{enabled="true"} == 1,
              "target_gate",
              "$1",
              "gate",
              "(.*)"
            )
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Gate benchmark route data is stale
          description: Route {{ $labels.route }} has {{ $labels.transport }} benchmark data older than 15 minutes.

      - alert: HyperspaceApiHighErrorRate
        expr: sum(rate(hyperspace_api_http_requests_total{status=~"5.."}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Control-plane API 5xx errors detected
          description: The control-plane API is returning 5xx responses above the accepted threshold.

      - alert: HyperspaceRateLimitRejections
        expr: sum(rate(hyperspace_public_rate_limit_rejections_total[5m])) > 0.1
        for: 5m
        labels:
          severity: info
        annotations:
          summary: Public API rate limiting is active
          description: Public API requests are being rejected by basic abuse-control rate limits.
