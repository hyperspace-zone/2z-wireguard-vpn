global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/hyperspace-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 127.0.0.1:9093

scrape_configs:
  - job_name: hyperspace-control-plane-api
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets:
          - control-plane.staging.hyperspace.zone
        labels:
          cluster: staging
          role: control-plane-api

  - job_name: hyperspace-control-plane-worker
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets:
          - 10.179.228.44:9091
        labels:
          cluster: staging
          role: control-plane-worker

  - job_name: hyperspace-gate-node
    scheme: http
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/gates.json
        refresh_interval: 30s
