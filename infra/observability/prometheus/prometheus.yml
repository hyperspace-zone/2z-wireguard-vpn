global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    cluster: hyperspace
    environment: testnet

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090
        labels:
          role: observability

  - job_name: node
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/node.yml
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: postgres-exporter
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/postgres-exporter.yml
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module:
        - http_2xx
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/http.yml
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: target
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module:
        - tcp_connect
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/tcp.yml
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: target
      - target_label: __address__
        replacement: 127.0.0.1:9115

  # Optional future path. Keep this file empty until API, worker, or gate-agent
  # expose native Prometheus metrics endpoints.
  - job_name: hyperspace-native
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/hyperspace-native.yml

