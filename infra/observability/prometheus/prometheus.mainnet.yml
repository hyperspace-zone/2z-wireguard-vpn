global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/hyperspace-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 127.0.0.1:9093

scrape_configs:
  - job_name: hyperspace-observability-node
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:9100
        labels:
          cluster: mainnet
          role: observability

  - job_name: hyperspace-control-plane-api
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets:
          - control-plane.hyperspace.zone
        labels:
          cluster: mainnet
          role: control-plane-api
          service_host: control-plane.hyperspace.zone
          service_ipv4: 5.199.161.13

  - job_name: hyperspace-control-plane-worker
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets:
          - 5.199.161.13:9091
        labels:
          cluster: mainnet
          role: control-plane-worker
          service_host: control-plane.hyperspace.zone
          service_ipv4: 5.199.161.13

  - job_name: hyperspace-gate-node
    scheme: http
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/gates.json
        refresh_interval: 30s
