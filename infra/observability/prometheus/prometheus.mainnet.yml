global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/hyperspace-alerts.yml

scrape_configs:
  - job_name: hyperspace-control-plane-api
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets:
          - control-plane.hyperspace.zone
        labels:
          cluster: mainnet
          role: control-plane-api

  - job_name: hyperspace-control-plane-worker
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets:
          - 5.199.161.13:9091
        labels:
          cluster: mainnet
          role: control-plane-worker
