global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/hyperspace-alerts.yml
  - /etc/prometheus/rules/hyperspace-db-isolation.yml
  - /etc/prometheus/rules/hyperspace-public-measurements.yml
  - /etc/prometheus/rules/hyperspace-r2-backups.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 127.0.0.1:9093

scrape_configs:
  - job_name: hyperspace-host-node
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:9100
        labels:
          cluster: mainnet
          role: observability
          service_host: observability.hyperspace.zone
          service_ipv4: 63.186.214.137
      - targets:
          - 172.26.6.152:9100
        labels:
          cluster: mainnet
          role: control-plane
          service_host: control-plane.hyperspace.zone
          service_ipv4: 63.188.134.222
    # SQL health is collected by the backup host but describes managed Neon.
    # Backup/archive and host metrics retain the actual maintenance host access.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'hyperspace_postgres_(connections|max_connections|longest_transaction_seconds|tables_requiring_vacuum|oldest_xid_age|autovacuum_workers|database_size_bytes)'
        target_label: service_host
        replacement: ep-small-resonance-bauifcjf.c-8.eu-central-1.aws.neon.tech
      - source_labels: [__name__]
        regex: 'hyperspace_postgres_(connections|max_connections|longest_transaction_seconds|tables_requiring_vacuum|oldest_xid_age|autovacuum_workers|database_size_bytes)'
        target_label: service_ipv4
        replacement: ''
      - source_labels: [__name__]
        regex: 'hyperspace_postgres_(connections|max_connections|longest_transaction_seconds|tables_requiring_vacuum|oldest_xid_age|autovacuum_workers|database_size_bytes)'
        target_label: role
        replacement: postgresql

  - job_name: hyperspace-postgresql
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:9187
        labels:
          cluster: mainnet
          role: postgresql
          service_host: ep-small-resonance-bauifcjf.c-8.eu-central-1.aws.neon.tech

  - job_name: hyperspace-blackbox-http
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - https://app.hyperspace.zone/
        labels:
          cluster: mainnet
          role: web
          probe_name: app-home
          service_host: app.hyperspace.zone
          service_ipv4: 63.188.134.222
      - targets:
          - https://app.hyperspace.zone/api/health
        labels:
          cluster: mainnet
          role: web
          probe_name: app-api-health
          service_host: app.hyperspace.zone
          service_ipv4: 63.188.134.222
      - targets:
          - https://control-plane.hyperspace.zone/health
        labels:
          cluster: mainnet
          role: control-plane
          probe_name: control-plane-health
          service_host: control-plane.hyperspace.zone
          service_ipv4: 63.188.134.222
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: hyperspace-blackbox-postgresql
    metrics_path: /probe
    params:
      module:
        - tcp_connect
    static_configs:
      - targets:
          - ep-small-resonance-bauifcjf.c-8.eu-central-1.aws.neon.tech:5432
        labels:
          cluster: mainnet
          role: postgresql
          probe_name: postgresql-tcp
          service_host: ep-small-resonance-bauifcjf.c-8.eu-central-1.aws.neon.tech
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: hyperspace-control-plane-api
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets:
          - control-plane.hyperspace.zone
        labels:
          cluster: mainnet
          role: control-plane-api
          service_host: control-plane.hyperspace.zone
          service_ipv4: 63.188.134.222

  - job_name: hyperspace-control-plane-worker
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets:
          - 172.26.6.152:9091
        labels:
          cluster: mainnet
          role: control-plane-worker
          service_host: control-plane.hyperspace.zone
          service_ipv4: 63.188.134.222

  - job_name: hyperspace-probes-worker
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets:
          - 172.26.6.152:9092
        labels:
          cluster: mainnet
          role: probes-worker
          service_host: control-plane.hyperspace.zone
          service_ipv4: 63.188.134.222

  - job_name: hyperspace-gate-node
    scheme: http
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/gates.json
        refresh_interval: 30s
