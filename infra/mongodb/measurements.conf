storage:
  dbPath: /var/lib/mongodb
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.5
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log
  logRotate: reopen
net:
  port: 27017
  bindIp: 127.0.0.1,88.216.62.149
  tls:
    mode: requireTLS
    certificateKeyFile: /etc/hyperspace/mongodb/server.pem
    CAFile: /etc/hyperspace/mongodb/ca.crt
    allowConnectionsWithoutCertificates: true
security:
  authorization: enabled
processManagement:
  timeZoneInfo: /usr/share/zoneinfo
