# Install as a drop-in for backup, restore-check, history-archive and health
# exporter on a remote PostgreSQL maintenance host. Keep existing mount and
# resource-limit drop-ins. Install the matching base units from this repository
# too: systemd dependency directives cannot be cleared in a drop-in. Those base
# units deliberately do not start a local PostgreSQL server. PG* credentials are
# supplied via the root-only env.

[Service]
Environment=HS_POSTGRES_MANAGED=1
Environment=PATH=/usr/lib/postgresql/18/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
